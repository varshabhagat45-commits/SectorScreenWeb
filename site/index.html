<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indian Sector Screen</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--mut:#94a3b8;--tx:#e2e8f0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
.wrap{max-width:1200px;margin:0 auto;padding:24px}
h1{font-size:22px}h2{font-size:17px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;margin:10px 0 4px;font-weight:600;color:var(--mut)}
select,button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px}
button{background:#2563eb;color:#fff;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.p-PASSED{background:#14532d;color:#86efac}.p-MARGINAL{background:#713f12;color:#fde68a}.p-ELIMINATED{background:#7f1d1d;color:#fca5a5}
.warn{background:#78350f;border:1px solid #b45309;border-radius:10px;padding:12px 14px;color:#fde68a;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:#334155;color:#cbd5e1;font-size:11px;margin:1px 3px 1px 0}
.hf{color:#fca5a5}.sf{color:#fde68a}
.bar-wrap{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar{height:14px;border-radius:4px;background:#2563eb}
.name{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
footer{margin-top:20px;font-size:12px;color:var(--mut)}
</style>
</head>
<body><div class="wrap">

<h1>Indian Sector Screen — 47-Criterion Quality &amp; Momentum</h1>

<div class="card">
  <label>Sector</label><select id="sector"></select>
  <label>Mode</label>
  <select id="mode">
    <option value="strict">strict (all 47 hard)</option>
    <option value="quality_first" selected>quality_first (growth &amp; valuation soft)</option>
    <option value="sector_adjusted">sector_adjusted (lowered thresholds)</option>
  </select>
  <p class="mut" id="meta"></p>
</div>

<div id="fit"></div>
<div id="summary"></div>
<div id="table"></div>
<div id="detail"></div>
<div id="chart"></div>
<div id="qualitative"></div>

<footer id="foot"></footer>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let DATA = null;
const CATS = ["PASSED","MARGINAL","ELIMINATED"];

const FACTORS = [
  "Competitive moat","Management quality","Order book / pipeline",
  "Upcoming results / guidance","Balance-sheet quality (beyond ratios)",
  "Sector cycle","ESG / regulatory risk","Valuation (is the price fair)"
];
const RATES = ["","Strong","Neutral","Weak"];

// Provisional auto-suggestions from financial data only (heuristic - verify).
function autoSuggest(m){
  m = m || {};
  const pe=m.pe, peg=m.peg;
  const de=m.current_de_ratio, nd=m.net_debt_to_ebitda, fcf=m.fcf_5y_total;
  const roce=(m.roe_current!=null?m.roe_current:m.current_roe);
  const margin=m.current_op_margin, roe5=m.avg_roe_5y;
  const sc=m.sales_cagr_5y, pc=m.profit_cagr_5y;
  const promo=m.promoter_holding;
  const res = {};
  res["Valuation (is the price fair)"] = (pe!=null)
    ? (pe<20 || (peg!=null&&peg<1.2) ? "Strong" : (pe>45 || (peg!=null&&peg>2.5) ? "Weak" : "Neutral")) : "";
  res["Balance-sheet quality (beyond ratios)"] = (de!=null)
    ? (de<40 && fcf!=null && fcf>0 && (nd==null||nd<1.5) ? "Strong" : (de>80 || (nd!=null&&nd>3) ? "Weak" : "Neutral")) : "";
  res["Sector cycle"] = (sc!=null)
    ? (sc>12 && pc!=null && pc>15 ? "Strong" : (sc<2 || (pc!=null&&pc<0) ? "Weak" : "Neutral")) : "";
  res["Competitive moat"] = (roce!=null)
    ? (roce>18 && margin!=null && margin>18 ? "Strong" : (roe5!=null&&roe5<10 ? "Weak" : "Neutral")) : "";
  res["Management quality"] = (promo!=null)
    ? (promo>=50 && roe5!=null&&roe5>14 ? "Strong" : (promo<35 ? "Weak" : "Neutral")) : "";
  return res;
}
function isAutoFactor(f){ return ["Valuation (is the price fair)","Balance-sheet quality (beyond ratios)",
  "Sector cycle","Competitive moat","Management quality"].indexOf(f)>=0; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function qKey(t){ return "qual:"+t; }
function qLoad(t){ try{ return JSON.parse(localStorage.getItem(qKey(t))||"{}"); }catch(e){ return {}; } }
function qSave(t,q){ localStorage.setItem(qKey(t), JSON.stringify(q)); }

function renderQualitative(companies){
  const cards = companies.map(c=>{
    const q = qLoad(c.ticker);
    const rows = FACTORS.map(f=>{
      const manual = q[f]||"";
      let val = manual, tag = "";
      if(!manual){
        const a = autoSuggest(c.metrics||{})[f];
        if(a){ val = a; tag = ' <span class="mut">(auto)</span>'; }
      }
      const opts = RATES.map(o=>`<option${o===val?" selected":""}>${o}</option>`).join("");
      return `<tr><td>${esc(f)}${tag}</td><td><select data-t="${esc(c.ticker)}" data-f="${esc(f)}">${opts}</select></td></tr>`;
    }).join("");
    const score = FACTORS.reduce((s,f)=> s + (q[f]==="Strong"?2 : q[f]==="Neutral"?1 : 0), 0);
    const strong = FACTORS.filter(f=>q[f]==="Strong").length;
    const weak = FACTORS.filter(f=>q[f]==="Weak").length;
    return `<div class="card">
      <h3>${esc(c.company||c.ticker)} <span class="mut">(${esc(c.ticker)})</span> <span class="mut">— score ${score}/16 · ${strong} Strong · ${weak} Weak</span></h3>
      <table>${rows}
        <tr><td>Notes</td><td><textarea data-n="${esc(c.ticker)}" rows="2" placeholder="e.g. dominant brand; order book growing; watch margin">${esc(q._notes||"")}</textarea></td></tr>
      </table></div>`;
  }).join("");
  $("#qualitative").innerHTML = `<div class="card"><h2>Qualitative assessment (manual research + auto-suggest)</h2>
    <p class="mut">Fields marked <b>(auto)</b> are <b>heuristic estimates from financial data only</b> (valuation, balance-sheet,
    growth/cycle trend, and profitability/moat &amp; promoter-quality proxies) — <b>verify before relying</b>. The harder subjective
    factors (order book, guidance, ESG) and the accuracy of the proxies still need your research. Rate any field to override; saved
    in <b>your browser only</b>. Many <b>Strong</b> + a clean screen = worth deeper study; not a recommendation.</p>
    ${cards || "<p class='mut'>Select a sector to begin.</p>"}
    <p class="mut"><a href="#" id="clearqual">Clear all my qualitative notes</a></p></div>`;
  document.querySelectorAll("#qualitative select").forEach(sel=>sel.addEventListener("change",e=>{
    const q=qLoad(e.target.dataset.t); q[e.target.dataset.f]=e.target.value; qSave(e.target.dataset.t,q); renderQualitative(companies);
  }));
  document.querySelectorAll("#qualitative textarea").forEach(t=>t.addEventListener("change",e=>{
    const q=qLoad(e.target.dataset.n); q._notes=e.target.value; qSave(e.target.dataset.n,q);
  }));
  const clr=document.querySelector("#clearqual");
  if(clr) clr.addEventListener("click",e=>{ e.preventDefault(); if(confirm("Clear all qualitative notes for every ticker?")){ Object.keys(localStorage).filter(k=>k.startsWith("qual:")).forEach(k=>localStorage.removeItem(k)); renderQualitative(companies);} });
}

function badge(c){return `<span class="badge p-${c}">${c}</span>`}

function render(){
  const sector = $("#sector").value, mode = $("#mode").value;
  const sec = DATA.sectors[sector];
  $("#fit").innerHTML = sec.note ? `<div class="warn"><b>Note:</b> ${sec.note}</div>` : "";
  $("#meta").textContent = `${sec.fit} fit | snapshot ${DATA.as_of}`;

  const modes = sec.modes[mode] || [];
  const counts = {PASSED:0, MARGINAL:0, ELIMINATED:0};
  modes.forEach(c=>counts[c.category]++);
  $("#summary").innerHTML = `<div class="card">` +
    CATS.map(c=>`${badge(c)} <b>${counts[c]}</b> <span class="mut">company(ies)</span>`).join(" &nbsp; ") +
    `</div>`;

  const rows = modes.map(c=>{
    const hf = c.hard.map(x=>`<span class="pill hf" title="${x.criterion}">${x.code}</span>`).join("");
    const sf = c.soft.map(x=>`<span class="pill sf" title="${x.criterion}">${x.code}</span>`).join("");
    return `<tr><td><b>${c.company||c.ticker}</b><br><span class="mut">${c.ticker}</span></td>
      <td>${badge(c.category)}</td><td>${c.passed}</td><td>${c.g1===null?'—':c.g1}</td>
      <td>${c.g2===null?'—':c.g2}</td><td>${c.failed}</td>
      <td>${c.market_cap_cr? Math.round(c.market_cap_cr).toLocaleString('en-IN'):'—'}</td>
      <td>${hf||'<span class="mut">none</span>'}</td><td>${sf||'<span class="mut">none</span>'}</td>
      <td>${c.missing}</td></tr>`;
  }).join("");
  $("#table").innerHTML = `<div class="card"><h2>Results (${modes.length} stocks | ${sector} | ${mode})</h2>
    <table><thead><tr><th>Company</th><th>Verdict</th><th>Passed</th><th>G1</th><th>G2</th>
    <th>Failed</th><th>MCap (Cr)</th><th>Hard fails</th><th>Soft flags</th><th>Missing</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="mut">Hover a pill for the criterion. Hard fails eliminate; soft flags are informational.</p></div>`;

  const detail = modes.filter(c=>c.hard.length).map(c=>`<h3>${c.ticker}</h3><ul>` +
    c.hard.map(x=>`<li><code>${x.code}</code> ${x.criterion}: <b>${fmt(x.value)}</b></li>`).join("") + "</ul>").join("");
  $("#detail").innerHTML = detail ? `<div class="card"><h2>Hard-gate failures</h2>${detail}</div>` : "";

  const top = [...modes].sort((a,b)=>(a.hard.length - b.hard.length) || (b.passed - a.passed)).slice(0,5);
  let bars = "";
  const max = Math.max(1, ...top.map(c=>c.hard.length ? c.hard.length : 1));
  top.forEach(c=>bars += `<div class="bar-wrap"><div class="name">${c.ticker.replace('.NS','')}</div>
     <div class="bar" style="width:${((c.hard.length/max)*60).toFixed(1)}%;background:#b23a48"></div>
     <span class="mut">${c.hard.length} hard fails</span></div>`);
  const strictNote = (mode==="strict" && counts.PASSED===0)
    ? `<div class="warn"><b>Strict mode found no PASSED name.</b> Every company here is ELIMINATED because it
       fails at least one hard quality/leverage/cash-flow/promoter criterion. The ranking below is a
       <b>relative screen, not a signal</b> — a higher rank just means it failed fewer hard gates. Switch to
       <b>quality_first</b> or <b>sector_adjusted</b> to treat growth &amp; valuation as soft flags (non-eliminating).</div>`
    : `<p class="mut">Ranked by fewest hard-gate failures, then points passed. This is a <b>ranking of a screen,
       not a recommendation</b> — always verify fundamentals and check with a financial advisor.</p>`;
  $("#chart").innerHTML = top.length ? `<div class="card"><h2>Top five by quality (fewest hard-gate failures)</h2>${strictNote}${bars}</div>` : "";

  renderQualitative(modes);

  $("#foot").textContent = "Research and analysis only — not personalized investment advice. Data snapshot; regenerate locally with build_data.py.";
}

function fmt(v){ if(v===null||v===undefined)return "missing"; if(typeof v==="boolean")return v?"true":"false";
  if(typeof v==="number")return v.toFixed(2); return v; }

fetch("data/sectors.json").then(r=>r.json()).then(d=>{
  DATA=d;
  const sel=$("#sector");
  sel.innerHTML = Object.keys(d.sectors).sort().map(s=>`<option>${s}</option>`).join("");
  sel.addEventListener("change", render);
  $("#mode").addEventListener("change", render);
  render();
});
</script>
</body></html>
